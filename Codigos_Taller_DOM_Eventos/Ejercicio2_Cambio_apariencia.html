<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2 - Cambio de apariencia</title>
  <style>
    #seccion {
      padding: 25px;
      margin-bottom: 12px;
      background-color: #eeeeee;
    }
    .resaltada {
      background-color: lightblue !important;
    }
  </style>
</head>
<body>
  <h1>Cambio de apariencia</h1>
  <section id="seccion">Esta es la sección que cambiará de fondo.</section>
  <button id="cambiar">Cambiar fondo</button>
  <button id="restaurar">Restaurar apariencia</button>

  <script>
    const seccion = document.getElementById("seccion");

    document.getElementById("cambiar").addEventListener("click", function () {
      seccion.classList.add("resaltada");
    });

    document.getElementById("restaurar").addEventListener("click", function () {
      seccion.classList.remove("resaltada");
    });
  </script>
</body>
</html>
