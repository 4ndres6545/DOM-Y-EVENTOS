<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Huellas Seguras - Buscar veterinario</title>
</head>
<body>
  <h1>Huellas Seguras</h1>
  <p>Consulta una especialidad veterinaria.</p>

  <label for="busqueda">Buscar veterinario:</label>
  <input id="busqueda" type="text" placeholder="Ejemplo: dermatología">
  <p id="resultado">Escribe para iniciar la búsqueda.</p>

  <script>
    const busqueda = document.getElementById("busqueda");
    const resultado = document.getElementById("resultado");

    busqueda.addEventListener("input", function () {
      const texto = busqueda.value.trim();

      if (texto === "") {
        resultado.textContent = "Escribe para iniciar la búsqueda.";
      } else {
        resultado.textContent = "Texto de búsqueda: " + texto;
      }
    });
  </script>
</body>
</html>
