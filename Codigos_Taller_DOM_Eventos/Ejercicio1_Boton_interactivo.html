<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 1 - Botón interactivo</title>
</head>
<body>
  <h1>Botón interactivo</h1>
  <p id="mensaje">Este es el texto original.</p>
  <button id="cambiar">Cambiar texto</button>

  <script>
    const parrafo = document.getElementById("mensaje");
    const boton = document.getElementById("cambiar");

    boton.addEventListener("click", function () {
      parrafo.textContent = "El texto ha cambiado correctamente.";
    });
  </script>
</body>
</html>
